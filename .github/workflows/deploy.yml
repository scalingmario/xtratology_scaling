name: Produccion CI/CD AWS

on:
  push:
    branches:
      - master
      - main

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: "us-east-1"
  S3_BUCKET: "xtratology-web-production"
  CLOUDFRONT_DISTRIBUTION_ID: "E1XXXXXXXXXXXX"

jobs:
  build-and-deploy:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10.33.4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Application (FSD/Angular)
        run: pnpm build --configuration production

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::123456789012:role/GitHubActionsS3DeployRole
          aws-region: ${{ env.AWS_REGION }}

      - name: Sync to AWS S3
        run: aws s3 sync dist/xtratology-web/browser s3://${{ env.S3_BUCKET }} --delete --exact-timestamps

      - name: Invalidate CloudFront Cache
        run: aws cloudfront create-invalidation --distribution-id ${{ env.CLOUDFRONT_DISTRIBUTION_ID }} --paths "/*"
